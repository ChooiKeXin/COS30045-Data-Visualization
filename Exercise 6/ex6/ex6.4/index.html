<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6.4 - Tooltips</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/visualisation.css">
</head>
<body>
    <header>
        <h1>TV Energy Consumption</h1>
    </header>
    <main>
        <div>
            <h1>Energy Consumption for different TV screen types and sizes</h1>
            <p>TV's vary considerably in energy consumption.</p>
        </div>
        
        <!-- Exercise 6.2: div for the histogram filter buttons -->
        <div id="filters_screen"></div>

        <!-- Exercise 6.1: div for the histogram -->
        <div id="histogram" class="responsive-svg-container"></div>

        <!-- Exercise 6.3: div for the scatterplot (tooltips in 6.4 are added to its circles) -->
        <div id="scatterplot" class="responsive-svg-container"></div>

        <div class="body">
            <h3>Data source</h3>
            <p>
                <a href="https://data.gov.au/data/dataset/energy-rating-for-household-appliances" target="_blank">
                    Energy Rating Data for household appliances - Televisions
                </a><br>
                Downloaded Jan 2026
            </p>
        </div>
    </main>
    <footer>
        <p>&copy; Data Visualisation Week 6</p>
    </footer>

    <!-- Load D3 and the modular scripts (the order matters: data loading, constants, interactions, charts) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/load-data.js"></script>
    <script src="js/shared-constants.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/scatterplot.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - SVG House (Before)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        svg { border: 1px solid #ccc; display: block; margin: 0 auto; }
        h1, h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercise 4.1: Draw SVGs</h1>
        <h2>Before</h2>
        <svg width="500" height="500">
            <!-- Sky (rect) -->
            <rect x="0" y="0" width="500" height="300" fill="#87CEEB" />
            
            <!-- Grass (rect) -->
            <rect x="0" y="300" width="500" height="200" fill="#228B22" />
            
            <!-- Sun (circle) -->
            <circle cx="100" cy="80" r="35" fill="#FFD700" />
            
            <!-- Cloud (ellipse) -->
            <ellipse cx="380" cy="70" rx="40" ry="20" fill="#FFFFFF" />
            
            <!-- House Body (rect) -->
            <rect x="160" y="200" width="180" height="150" fill="#A0522D" />
            
            <!-- Roof (polygon) -->
            <polygon points="140,200 250,110 360,200" fill="#B22222" />
            
            <!-- Windows Group (<g> with transform) -->
            <g transform="translate(185, 230)" fill="#ADD8E6" stroke="#FFFFFF" stroke-width="2">
                <rect x="0" y="0" width="35" height="35" />
                <rect x="95" y="0" width="35" height="35" />
            </g>
            
            <!-- Door (rect & circle) -->
            <rect x="230" y="280" width="40" height="70" fill="#8B4513" />
            <circle cx="262" cy="318" r="3" fill="#000000" />
            
            <!-- Path (path) -->
            <path d="M 230,350 Q 210,420 170,500 L 210,500 Q 240,430 270,350 Z" fill="#DAA520" />
            
            <!-- Tree Trunk (line) & Crown (circle) -->
            <line x1="70" y1="360" x2="70" y2="280" stroke="#8B4513" stroke-width="16" />
            <circle cx="70" cy="260" r="30" fill="#2E8B57" />
            
            <!-- Text (text) -->
            <text x="370" y="260" font-family="sans-serif" font-size="20" fill="#000000">House</text>
        </svg>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - SVG House (After)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        svg { border: 1px solid #ccc; display: block; margin: 0 auto; }
        h1, h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercise 4.1: Draw SVGs</h1>
        <h2>After</h2>
        <svg width="500" height="500">
            <!-- Sky (rect) -->
            <rect x="0" y="0" width="500" height="300" fill="#87CEEB" />
            
            <!-- Grass (rect) -->
            <rect x="0" y="300" width="500" height="200" fill="#228B22" />
            
            <!-- Sun (circle) -->
            <circle cx="420" cy="70" r="35" fill="#FFD700" />
            
            <!-- Cloud 1 (ellipse) -->
            <ellipse cx="120" cy="60" rx="45" ry="22" fill="#FFFFFF" />
            <!-- Cloud 2 (ellipse) -->
            <ellipse cx="230" cy="85" rx="35" ry="18" fill="#FFFFFF" opacity="0.9" />
            
            <!-- Chimney (rect) -->
            <rect x="310" y="120" width="25" height="50" fill="#696969" />
            
            <!-- House Body (rect) -->
            <rect x="160" y="200" width="180" height="150" fill="#CD853F" />
            
            <!-- Roof (polygon) -->
            <polygon points="140,200 250,110 360,200" fill="#8B0000" />
            
            <!-- Windows Group (<g> with grid stroke) -->
            <g transform="translate(180, 225)" fill="#E0FFFF" stroke="#4682B4" stroke-width="2">
                <rect x="0" y="0" width="40" height="40" />
                <line x1="20" y1="0" x2="20" y2="40" />
                <line x1="0" y1="20" x2="40" y2="20" />
                
                <rect x="100" y="0" width="40" height="40" />
                <line x1="120" y1="0" x2="120" y2="40" />
                <line x1="100" y1="20" x2="140" y2="20" />
            </g>
            
            <!-- Door (rect & circle) -->
            <rect x="230" y="280" width="40" height="70" fill="#5C4033" />
            <circle cx="262" cy="318" r="4" fill="#FFD700" />
            
            <!-- Curved Path (path) -->
            <path d="M 230,350 Q 290,420 330,500 L 370,500 Q 330,430 270,350 Z" fill="#DAA520" />
            
            <!-- Tree 1 (line & circle) -->
            <line x1="90" y1="360" x2="90" y2="280" stroke="#8B4513" stroke-width="16" />
            <circle cx="90" cy="260" r="32" fill="#2E8B57" />
            
            <!-- Text (text) -->
            <text x="360" y="280" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2F4F4F">My House</text>
        </svg>
    </div>
</body>
</html>
